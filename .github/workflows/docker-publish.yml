name: docker-publish

on:
  workflow_run:
    workflows: [e2e]
    types: [completed]

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            hub: nguyenson1710/travelai-web
            ghcr: ghcr.io/jasontm17/travelai-web
            context: ./web
          - service: api
            hub: nguyenson1710/travelai-api
            ghcr: ghcr.io/jasontm17/travelai-api
            context: ./api
          - service: identity
            hub: nguyenson1710/travelai-identity
            ghcr: ghcr.io/jasontm17/travelai-identity
            context: ./identity
          - service: ai
            hub: nguyenson1710/travelai-ai
            ghcr: ghcr.io/jasontm17/travelai-ai
            context: ./ai
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify CI passed for the same commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for attempt in $(seq 1 30); do
            conclusion="$(gh run list --workflow ci.yml --commit "$HEAD_SHA" --limit 1 --json conclusion --jq '.[0].conclusion // ""')"
            if [ "$conclusion" = "success" ]; then
              exit 0
            fi
            if [ -n "$conclusion" ] && [ "$conclusion" != "in_progress" ] && [ "$conclusion" != "queued" ]; then
              echo "CI for $HEAD_SHA failed with conclusion: $conclusion"
              exit 1
            fi
            sleep 20
          done
          echo "CI for $HEAD_SHA did not complete successfully within 10 minutes."
          exit 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select registries
        id: registries
        shell: bash
        env:
          HUB_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          {
            echo 'images<<EOF'
            echo '${{ matrix.ghcr }}'
            if [ "$HUB_ENABLED" = "true" ]; then
              echo '${{ matrix.hub }}'
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.source=https://github.com/JasonTM17/VN_TravelAI
            org.opencontainers.image.title=travelai-${{ matrix.service }}
            org.opencontainers.image.description=TravelAI ${{ matrix.service }} service
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.event.workflow_run.head_sha }}
