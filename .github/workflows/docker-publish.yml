name: docker-publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            hub: nguyenson1710/travelai-web
            ghcr: ghcr.io/jasontm17/travelai-web
            context: ./web
          - service: api
            hub: nguyenson1710/travelai-api
            ghcr: ghcr.io/jasontm17/travelai-api
            context: ./api
          - service: identity
            hub: nguyenson1710/travelai-identity
            ghcr: ghcr.io/jasontm17/travelai-identity
            context: ./identity
          - service: ai
            hub: nguyenson1710/travelai-ai
            ghcr: ghcr.io/jasontm17/travelai-ai
            context: ./ai
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ matrix.hub }}
            ${{ matrix.ghcr }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.source=https://github.com/JasonTM17/VN_TravelAI
            org.opencontainers.image.title=travelai-${{ matrix.service }}
            org.opencontainers.image.description=TravelAI ${{ matrix.service }} service
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
