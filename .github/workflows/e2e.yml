name: e2e

# Playwright against local compose ports. Skips when repo vars disable it
# (e.g. Actions billing blocked). Run locally:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#   cd e2e && pnpm test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    # Set repository variable E2E_ENABLED=true to run in Actions when billing allows.
    if: ${{ vars.E2E_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
          sleep 40
      - name: Install e2e deps
        working-directory: e2e
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: e2e
        run: pnpm exec playwright install chromium --with-deps
      - name: Smoke + booking
        working-directory: e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:53000
        run: pnpm exec playwright test tests/smoke.spec.ts tests/booking-happy.spec.ts
      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml down -v

  e2e-status:
    runs-on: ubuntu-latest
    steps:
      - name: Document e2e gate
        run: |
          if [ "${{ vars.E2E_ENABLED }}" = "true" ]; then
            echo "E2E enabled via repo variable E2E_ENABLED"
          else
            echo "E2E skipped in CI (set repository variable E2E_ENABLED=true to enable)."
            echo "Required locally after compose up: cd e2e && pnpm test"
          fi
