name: e2e

# Playwright against local compose ports. Run locally:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#   cd e2e && pnpm test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:53000/healthz >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f docker-compose.yml -f docker-compose.local.yml ps
          docker compose -f docker-compose.yml -f docker-compose.local.yml logs
          exit 1
      - name: Install e2e deps
        working-directory: e2e
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: e2e
        run: pnpm exec playwright install chromium --with-deps
      - name: Run all E2E specs
        working-directory: e2e
        env:
          WEB_URL: http://localhost:53000
          BASE_WEB: http://localhost:53000
          BASE_IDENTITY: http://localhost:53002
        run: pnpm test
      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml down -v
