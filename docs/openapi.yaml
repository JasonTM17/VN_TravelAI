openapi: 3.1.0
info:
  title: TravelAI API
  version: 0.1.0
  description: |
    Canonical HTTP contract for TravelAI services.
    Paths are namespaced by service responsibility.
    Success envelope: `{ "success": true, "data": ..., "meta"?: ... }`
    Errors: RFC 7807 Problem Details where applicable.
  license:
    name: MIT
servers:
  - url: http://localhost:3001
    description: api (catalog, booking)
  - url: http://localhost:3002
    description: identity
  - url: http://localhost:3003
    description: ai

tags:
  - name: health
  - name: auth
  - name: destinations
  - name: hotels
  - name: tours
  - name: flights
  - name: transport
  - name: bookings
  - name: wishlists
  - name: ai

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: healthz
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      tags: [health]
      summary: Readiness probe
      operationId: readyz
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Not ready

  /metrics:
    get:
      tags: [health]
      summary: Prometheus metrics
      operationId: metrics
      responses:
        "200":
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string

  /v1/auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      operationId: authRegister
      servers:
        - url: http://localhost:3002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/auth/login:
    post:
      tags: [auth]
      summary: Login
      operationId: authLogin
      servers:
        - url: http://localhost:3002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          description: Account locked

  /v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate refresh token
      operationId: authRefresh
      servers:
        - url: http://localhost:3002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccess"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke refresh token
      operationId: authLogout
      servers:
        - url: http://localhost:3002
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        "204":
          description: No content

  /v1/auth/me:
    get:
      tags: [auth]
      summary: Current user profile
      operationId: authMe
      servers:
        - url: http://localhost:3002
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/auth/change-password:
    post:
      tags: [auth]
      summary: Change password for authenticated user
      operationId: authChangePassword
      servers:
        - url: http://localhost:3002
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Password changed; refresh tokens revoked
        "400":
          description: Validation error
        "401":
          $ref: "#/components/responses/Unauthorized"

  /.well-known/jwks.json:
    get:
      tags: [auth]
      summary: JWKS public keys
      operationId: jwks
      servers:
        - url: http://localhost:3002
      responses:
        "200":
          description: JWKS
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object

  /v1/destinations:
    get:
      tags: [destinations]
      summary: List destinations
      operationId: listDestinations
      parameters:
        - name: country
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationListResponse"

  /v1/destinations/{slug}:
    get:
      tags: [destinations]
      summary: Destination detail
      operationId: getDestination
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Destination"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/hotels:
    get:
      tags: [hotels]
      summary: Search hotels
      operationId: searchHotels
      parameters:
        - name: destination
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: integer
        - name: maxPrice
          in: query
          schema:
            type: integer
        - name: stars
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HotelListResponse"

  /v1/hotels/{slug}:
    get:
      tags: [hotels]
      summary: Hotel detail
      operationId: getHotel
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Hotel"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/tours:
    get:
      tags: [tours]
      summary: Search tours
      operationId: searchTours
      parameters:
        - name: destination
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TourListResponse"

  /v1/tours/{slug}:
    get:
      tags: [tours]
      summary: Tour detail
      operationId: getTour
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Tour"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/flights/search:
    get:
      tags: [flights]
      summary: Mock flight search
      operationId: searchFlights
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
        - name: to
          in: query
          required: true
          schema:
            type: string
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: passengers
          in: query
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlightListResponse"

  /v1/transports:
    get:
      tags: [transport]
      summary: Search mock bus/train routes
      operationId: searchTransports
      parameters:
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: mode
          in: query
          schema:
            type: string
            enum: [bus, train]
        - name: q
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransportListResponse"

  /v1/transports/{slug}:
    get:
      tags: [transport]
      summary: Transport route detail
      operationId: getTransport
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: OK
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/bookings:
    get:
      tags: [bookings]
      summary: List my bookings
      operationId: listBookings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingListResponse"
    post:
      tags: [bookings]
      summary: Create booking
      operationId: createBooking
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/bookings/{id}/pay:
    post:
      tags: [bookings]
      summary: Mock pay booking
      operationId: payBooking
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                outcome:
                  type: string
                  enum: [success, fail]
                  default: success
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Booking"

  /v1/bookings/{id}/cancel:
    post:
      tags: [bookings]
      summary: Cancel booking
      operationId: cancelBooking
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Booking"

  /v1/wishlists:
    get:
      tags: [wishlists]
      summary: List wishlist
      operationId: listWishlist
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
    post:
      tags: [wishlists]
      summary: Add wishlist item
      operationId: addWishlist
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemType, itemId]
              properties:
                itemType:
                  type: string
                  enum: [hotel, tour, destination]
                itemId:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Created
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/wishlists/{id}:
    delete:
      tags: [wishlists]
      summary: Remove wishlist item
      operationId: removeWishlist
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: No content

  /v1/search:
    get:
      tags: [destinations]
      summary: Unified full-text search
      operationId: unifiedSearch
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK

  /v1/chat:
    post:
      tags: [ai]
      summary: AI concierge chat
      operationId: aiChat
      servers:
        - url: http://localhost:3003
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                conversationId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      reply:
                        type: string
                      conversationId:
                        type: string
                      degraded:
                        type: boolean

  /v1/itineraries:
    post:
      tags: [ai]
      summary: Generate multi-day itinerary
      operationId: createItinerary
      servers:
        - url: http://localhost:3003
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItineraryRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Itinerary"

  /v1/itineraries/{id}:
    get:
      tags: [ai]
      summary: Get itinerary
      operationId: getItinerary
      servers:
        - url: http://localhost:3003
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Itinerary"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Validation error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, ready, not_ready]
        service:
          type: string

    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

    RegisterRequest:
      type: object
      required: [email, password, fullName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        fullName:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        fullName:
          type: string
        createdAt:
          type: string
          format: date-time

    AuthSuccess:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            expiresIn:
              type: integer
            user:
              $ref: "#/components/schemas/User"

    Destination:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        nameVi:
          type: string
        nameEn:
          type: string
        countryCode:
          type: string
        region:
          type: string
        descriptionVi:
          type: string
        descriptionEn:
          type: string
        heroImageUrl:
          type: string
        latitude:
          type: number
        longitude:
          type: number

    DestinationListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/Destination"
        meta:
          $ref: "#/components/schemas/PageMeta"

    Hotel:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        stars:
          type: integer
        priceFromVnd:
          type: integer
        currency:
          type: string
        destinationSlug:
          type: string
        images:
          type: array
          items:
            type: string
        amenities:
          type: array
          items:
            type: string
        rating:
          type: number

    HotelListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/Hotel"
        meta:
          $ref: "#/components/schemas/PageMeta"

    Tour:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        titleVi:
          type: string
        titleEn:
          type: string
        durationDays:
          type: integer
        priceFromVnd:
          type: integer
        destinationSlug:
          type: string
        images:
          type: array
          items:
            type: string

    TourListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/Tour"
        meta:
          $ref: "#/components/schemas/PageMeta"

    Flight:
      type: object
      properties:
        id:
          type: string
          format: uuid
        airline:
          type: string
        flightNumber:
          type: string
        from:
          type: string
        to:
          type: string
        departAt:
          type: string
          format: date-time
        arriveAt:
          type: string
          format: date-time
        priceVnd:
          type: integer
        cabin:
          type: string

    FlightListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/Flight"

    Transport:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        operator:
          type: string
        mode:
          type: string
          enum: [bus, train]
        from:
          type: string
        to:
          type: string
        fromCity:
          type: string
        toCity:
          type: string
        departAt:
          type: string
          format: date-time
        arriveAt:
          type: string
          format: date-time
        priceVnd:
          type: integer
        durationMin:
          type: integer
        seatsLeft:
          type: integer

    TransportListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/Transport"
        meta:
          $ref: "#/components/schemas/PageMeta"

    CreateBookingRequest:
      type: object
      required: [itemType, itemId, guests, startDate]
      properties:
        itemType:
          type: string
          enum: [hotel, tour, flight]
        itemId:
          type: string
          format: uuid
        guests:
          type: integer
          minimum: 1
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        contactName:
          type: string
        contactEmail:
          type: string
          format: email
        contactPhone:
          type: string

    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, pending_payment, confirmed, cancelled]
        itemType:
          type: string
        itemId:
          type: string
        totalVnd:
          type: integer
        guests:
          type: integer
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time

    BookingListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/Booking"

    ItineraryRequest:
      type: object
      required: [destination, days, budgetVnd]
      properties:
        destination:
          type: string
        days:
          type: integer
          minimum: 1
          maximum: 21
        budgetVnd:
          type: integer
        travelers:
          type: integer
          default: 2
        style:
          type: string
          enum: [couple, family, backpacker, luxury, foodie]
        notes:
          type: string

    Itinerary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        destination:
          type: string
        days:
          type: array
          items:
            type: object
            properties:
              day:
                type: integer
              title:
                type: string
              activities:
                type: array
                items:
                  type: object
                  properties:
                    time:
                      type: string
                    title:
                      type: string
                    description:
                      type: string
                    place:
                      type: string
        estimatedBudgetVnd:
          type: integer
        hotelSuggestions:
          type: array
          items:
            type: object
            properties:
              slug:
                type: string
              name:
                type: string
        degraded:
          type: boolean
        createdAt:
          type: string
          format: date-time

    PageMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
